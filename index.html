<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<meta name="theme-color" content="#1d1d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f3; --panel:#ffffff; --side:#efefea; --ink:#1d1d1b; --muted:#6f6f68; --faint:#a5a59c;
    --line:#e2e2db; --accent:#2f6fed; --accent-soft:#e6eeff;
    --p1:#e5484d; --p2:#f08c00; --p3:#2f6fed; --ok:#2b9a66; --warn:#c2410c; --wait:#8e4ec6;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141413; --panel:#1c1c1a; --side:#181816; --ink:#ecece6; --muted:#9b9b92; --faint:#66665f;
      --line:#2c2c29; --accent:#5b8cff; --accent-soft:#1e2a45; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh}

  /* Sidebar */
  aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px 10px;overflow:auto;display:flex;flex-direction:column;gap:16px}
  .brand{display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav h4{margin:0 0 6px;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--muted);transition:background .1s,color .1s}
  .nav button:hover{background:rgba(127,127,120,.1);color:var(--ink)}
  .nav button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
  .ico{width:16px;height:16px;display:inline-grid;place-items:center;flex:none}
  .ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .nav button.on .ico{color:var(--accent)}
  .nav .ct.badge{background:var(--p1);color:#fff;border-radius:99px;padding:0 6px;font-weight:600}
  .nav .phint{padding:2px 10px;color:var(--faint);font-size:12px;line-height:1.5}
  .nav .phint code{font-family:var(--mono);font-size:11px}
  .acct{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 6px 2px 8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .acct .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none;position:relative;text-transform:uppercase}
  .acct .av i{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--side);background:var(--ok)}
  .acct.off .av i{background:var(--p2)}
  .acct .em{flex:1;min-width:0;line-height:1.3}
  .acct .em b{display:block;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct .em span{font-size:11px;color:var(--faint)}
  .acct button{background:none;border:0;color:var(--faint);padding:5px;border-radius:6px;display:grid}
  .acct button:hover{color:var(--ink);background:rgba(127,127,120,.12)}
  .menubtn{display:none;background:none;border:0;padding:4px;margin-left:-4px;color:var(--ink);place-items:center;align-self:center}
  .menubtn svg{width:22px;height:22px}
  .tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;font-size:10.5px;color:var(--faint);position:relative}
  .tabbar button .ico,.tabbar button .ico svg{width:20px;height:20px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .tabbar .tb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--p1);color:#fff;border-radius:99px;font-size:9.5px;padding:0 5px;font-weight:700}
  .fab{display:none;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:16;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;place-items:center;box-shadow:0 6px 20px rgba(47,111,237,.4)}
  .fab svg{width:24px;height:24px;stroke-width:2.2}
  .sidescrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:24}
  .search-wrap{margin-left:auto;position:relative;align-self:center}
  .search-wrap .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  .titlerow .search-wrap .search{padding-left:30px;margin-left:0}
  .nav .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .nav .ct.hot{color:var(--p1)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .status{margin-top:auto;padding:8px 10px;font-size:11.5px;color:var(--faint);display:flex;gap:7px;align-items:center}
  .status i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
  .status.db i{background:var(--ok)} .status.local i{background:var(--p2)}

  /* Main */
  main{overflow:auto;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:22px 32px 12px;border-bottom:1px solid transparent}
  .top.scrolled{border-bottom-color:var(--line)}
  .titlerow{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px 12px;margin-bottom:14px}
  .titlerow h1{margin:0;font-size:22px;letter-spacing:-.02em}
  .titlerow .sub{color:var(--muted);font-size:13px}
  .titlerow .search{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:200px;outline:none}
  .titlerow .search:focus{border-color:var(--accent)}
  .quick{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px 4px 4px 14px;display:flex;align-items:center;gap:8px}
  .quick:focus-within{border-color:var(--accent)}
  .quick input{flex:1;border:0;background:none;outline:none;padding:9px 0;font-size:14.5px}
  .quick button{background:var(--ink);color:var(--bg);border:0;border-radius:7px;padding:8px 14px;font-weight:600}
  .hint{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;margin-top:7px;font-size:12px;color:var(--faint);align-items:center}
  .hint code{font-family:var(--mono);font-size:11px;background:rgba(127,127,120,.12);padding:1px 5px;border-radius:4px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;background:rgba(127,127,120,.12);color:var(--muted);white-space:nowrap}
  .content{padding:8px 32px 80px;flex:1}

  /* List */
  .group{margin-top:18px}
  .group h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center}
  .group h3 .n{font-family:var(--mono);color:var(--faint);font-weight:500}
  .group.overdue h3{color:var(--p1)}
  .task{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-bottom:6px;cursor:pointer;transition:border-color .12s}
  .task:hover{border-color:var(--faint)}
  .task.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .check{width:19px;height:19px;border-radius:50%;border:2px solid var(--faint);background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:#fff;font-size:11px}
  .check.p1{border-color:var(--p1)} .check.p2{border-color:var(--p2)} .check.p3{border-color:var(--p3)}
  .check:hover{background:rgba(127,127,120,.15)}
  .task.done .check{background:var(--ok);border-color:var(--ok)}
  .task.done .ttl{text-decoration:line-through;color:var(--faint)}
  .body{flex:1;min-width:0}
  .ttl{font-weight:500;word-wrap:break-word}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
  .meta .due.over{color:var(--p1);font-weight:600} .meta .due.today{color:var(--ok);font-weight:600}
  .meta .wait{color:var(--wait)}
  .meta .doing{color:var(--accent);font-weight:600}
  .star{background:none;border:0;color:var(--faint);font-size:15px;padding:0 2px;line-height:1;opacity:.0}
  .task:hover .star,.star.on{opacity:1} .star.on{color:#f5b301}
  .empty{text-align:center;color:var(--faint);padding:60px 20px}
  .empty b{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
  .connecting{color:var(--faint);padding:40px 0;text-align:center}

  /* Board */
  .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;margin-top:14px;align-items:start}
  .col{background:var(--side);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:200px}
  .col.over{border-color:var(--accent);background:var(--accent-soft)}
  .col h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:8px}
  .col h3 .n{font-family:var(--mono);color:var(--faint);font-weight:500}
  .col .task{margin-bottom:8px}
  .task.dragging{opacity:.4}

  /* Drawer */
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .2s ease;z-index:20;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dhead{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dhead .x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);padding:0 4px}
  .dbody{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
  .dtitle{width:100%;border:0;outline:none;background:none;font-size:18px;font-weight:600;resize:none;padding:0}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:90px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{border:0;background:none;padding:6px 0;border-radius:6px;font-size:12.5px;color:var(--muted)}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  .subs .s{display:flex;align-items:center;gap:8px;padding:4px 0}
  .subs .s input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok)}
  .subs .s span{flex:1} .subs .s.d span{text-decoration:line-through;color:var(--faint)}
  .subs .s .rm{background:none;border:0;color:var(--faint);opacity:0}
  .subs .s:hover .rm{opacity:1}
  .subadd{display:flex;gap:6px;margin-top:4px}
  .subadd input{flex:1}
  .dfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;font-size:12px;color:var(--faint)}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px}
  .btn.danger{color:var(--p1)} .btn.danger.arm{background:var(--p1);color:#fff;border-color:var(--p1)}
  .dfoot .btn:first-child{margin-left:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:30}
  .toast.show{transform:translateX(-50%);opacity:1;pointer-events:auto}
  .banner{background:#fff4e5;color:#8a4b00;border:1px solid #f5d6a8;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:10px}
  @media (prefers-color-scheme:dark){.banner{background:#33240f;color:#f2c48a;border-color:#5a3d14}}

  /* Auth */
  .auth{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;place-items:center;padding:20px}
  .auth.show{display:grid}
  .card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px}
  .card h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .card h2 .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
  .card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .card .field{margin-bottom:12px}
  .card .go{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px;font-weight:600;margin-top:4px}
  .card .go:disabled{opacity:.6}
  .card .swap{background:none;border:0;color:var(--accent);padding:0;font-size:13px}
  .card .msg{font-size:12.5px;margin:10px 0 0;min-height:18px}
  .card .msg.err{color:var(--p1)} .card .msg.ok{color:var(--ok)}
  .signout{background:none;border:0;color:var(--faint);font-size:11.5px;padding:0;margin-left:auto;text-decoration:underline}

  /* View tabs + new task */
  .vtabs{display:inline-flex;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:2px;align-self:center}
  .vtabs:empty{display:none}
  .vtabs button{border:0;background:none;padding:3px 10px;border-radius:6px;font-size:12.5px;color:var(--muted)}
  .vtabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  .quick button.more{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .quick button.more:hover{color:var(--ink);border-color:var(--faint)}
  .newbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:8px 10px;font-weight:600}
  .newbtn .ico{color:var(--accent)} .newbtn .ico svg{stroke-width:2.2}
  .newbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .newbtn:hover{border-color:var(--faint)}

  /* Timeline (Gantt) */
  .content.tl{padding-bottom:16px}
  .gtool{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:12px 0 10px}
  .gtool .sp{flex:1}
  .gtool label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .gtool .ghelp{font-size:12px;color:var(--faint);width:100%}
  .zseg{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
  .zseg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--muted)}
  .zseg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  .gwrap{--lw:380px;--rh:36px;--wk:rgba(127,127,120,.07);--rowhover:#f4f7fe;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:auto;position:relative;user-select:none}
  @media (prefers-color-scheme:dark){.gwrap{--rowhover:#20242d;--wk:rgba(255,255,255,.03)}}
  .gin{width:max-content;min-width:100%;position:relative}
  .grow{display:flex;height:var(--rh);border-bottom:1px solid var(--line)}
  .gl{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 60px 60px 40px;align-items:center;font-size:12.5px;cursor:pointer}
  .gl>*{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gl .gn{display:flex;align-items:center;gap:7px;padding-left:12px}
  .gl .gn>span:last-child{overflow:hidden;text-overflow:ellipsis}
  .gl .num{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .gl .strike{text-decoration:line-through;color:var(--faint)}
  .gr{position:relative;flex:none;width:var(--gw)}
  .zday .grow:not(.ghead) .gr{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(90deg,transparent calc(var(--dw)*5),var(--wk) calc(var(--dw)*5));background-size:var(--dw) 100%,calc(var(--dw)*7) 100%}
  .zweek .grow:not(.ghead) .gr{background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px),linear-gradient(90deg,transparent calc(var(--dw)*5),var(--wk) calc(var(--dw)*5));background-size:calc(var(--dw)*7) 100%,calc(var(--dw)*7) 100%}
  .grow:not(.ghead):hover>.gl,.grow:not(.ghead):hover>.gr,.grow.sel>.gl,.grow.sel>.gr{background-color:var(--rowhover)}
  .grow.sel>.gl{box-shadow:inset 3px 0 0 var(--accent)}
  .ghead{position:sticky;top:0;z-index:4;height:48px}
  .ghead .gl{z-index:5;cursor:default;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
  .ghead .gr{background:var(--panel)}
  .gh1,.gh2{position:absolute;left:0;right:0;height:24px;top:0}
  .gh2{top:24px;border-top:1px solid var(--line)}
  .gh1 div,.gh2 div{position:absolute;top:0;height:24px;line-height:24px;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden}
  .gh1 div{font-weight:600;color:var(--ink)}
  .zday .gh2 div{text-align:center;padding:0}
  .gh2 div.wk{background:var(--wk)}
  .gh2 div.td{background:var(--p1);color:#fff;font-weight:600}
  .gh2 small{opacity:.65;margin-left:2px;font-size:9.5px}
  .gtoday{position:absolute;top:48px;bottom:0;width:2px;background:var(--p1);opacity:.6;z-index:2;pointer-events:none}
  .bar{position:absolute;top:8px;height:20px;border-radius:5px;background:var(--bc);touch-action:none;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:1;min-width:8px}
  .bar .pg{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.25);border-radius:5px 0 0 5px;pointer-events:none}
  .bar .hl,.bar .hr{position:absolute;top:-2px;bottom:-2px;width:9px;cursor:ew-resize;z-index:1}
  .bar .hl{left:-3px} .bar .hr{right:-3px}
  .bar:hover .hl,.bar:hover .hr{background:linear-gradient(90deg,transparent 3px,rgba(255,255,255,.75) 3px,rgba(255,255,255,.75) 5px,transparent 5px)}
  .bar .bl{position:absolute;left:calc(100% + 7px);top:0;line-height:20px;font-size:12px;white-space:nowrap;color:var(--ink);pointer-events:none}
  .bar.done{opacity:.5}
  .bar.over{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--p1)}
  .bar.drag{cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:4}
  .bar.ghost{background:var(--accent);opacity:.65}
  .gr.unsched{cursor:crosshair}
  .gr .hintx{position:absolute;top:0;line-height:var(--rh);font-size:11.5px;color:var(--faint);pointer-events:none;white-space:nowrap}
  .ggrp>.gl,.ggrp>.gr{background-color:var(--side)}
  .ggrp .gl{font-weight:600}
  .ggrp .caret{width:12px;color:var(--muted);font-size:10px}
  .ggrp .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
  .sumbar{position:absolute;top:13px;height:9px;background:var(--ink);opacity:.7;border-radius:2px 2px 0 0;pointer-events:none}
  .sumbar:before,.sumbar:after{content:'';position:absolute;top:9px;border:4px solid transparent;border-top:5px solid var(--ink)}
  .sumbar:before{left:0;border-left-color:var(--ink)} .sumbar:after{right:0;border-right-color:var(--ink)}
  .gadd .gl{color:var(--accent);font-weight:500}
  .gempty{position:absolute;left:var(--lw);right:0;top:60px;text-align:center;color:var(--faint);pointer-events:none}
  .gtip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap;box-shadow:var(--shadow)}

  /* Editor extras */
  .row3{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px}
  .sl span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .qchips button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .qchips button:hover{border-color:var(--accent);color:var(--accent)}
  .qchips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
  .seg.pri button .dot{display:inline-block;margin-right:5px;vertical-align:0}
  .btn.sm{padding:4px 10px;font-size:12.5px}
  .dfoot .btn{color:var(--ink)} .dfoot .btn.danger{color:var(--p1)} .dfoot .btn.danger.arm{color:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .dtitle.need::placeholder{color:var(--p1)}
  .err-msg{color:var(--p1);font-size:12px;min-height:0}
  .dur-note{font-size:12px;color:var(--muted);margin-top:6px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;opacity:0;pointer-events:none;transition:opacity .15s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer.create{top:50%;left:50%;right:auto;height:auto;max-height:min(760px,92vh);width:min(540px,calc(100vw - 24px));border:1px solid var(--line);border-radius:14px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .15s,opacity .15s}
  .drawer.create.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .toast button{background:none;border:0;color:var(--accent);font-weight:700;margin-left:14px;padding:0}

  @media (max-width:760px){
    .gwrap{--lw:150px}
    .gl{grid-template-columns:1fr} .gl .num{display:none}
    .row3{grid-template-columns:1fr 1fr} .row3 .sl:last-child{grid-column:span 2}
    .quick button.more{display:none}
    .app{grid-template-columns:1fr}
    aside{position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);z-index:25;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    body.side-open aside{transform:none}
    body.side-open .sidescrim{display:block}
    .menubtn{display:grid}
    .tabbar{display:flex} .fab{display:grid}
    .newbtn{display:none}
    .top{padding:12px 16px 10px} .content{padding:4px 16px 110px} .content.tl{padding-bottom:80px}
    .titlerow h1{font-size:20px}
    .titlerow .search{width:112px}
    .vtabs{order:5}
    .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
    .board{grid-template-columns:repeat(4,240px);overflow-x:auto}
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main">
    <div class="top" id="top">
      <div class="titlerow">
        <button class="menubtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 id="vtitle">Today</h1><span class="sub" id="vsub"></span><div class="vtabs" id="vtabs"></div>
        <div class="search-wrap"><span class="ico"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></span><input class="search" id="search" placeholder="Search  /" autocomplete="off"></div>
      </div>
      <form class="quick" id="quick">
        <input id="qa" placeholder="Add a task — e.g. Order 5mm acrylic tmr #cradle !1" autocomplete="off">
        <button type="button" class="more" id="qmore" title="Open the full form (Shift+N)">Details…</button>
        <button type="submit">Add</button>
      </form>
      <div class="hint" id="hint"></div>
      <div id="bannerSlot"></div>
    </div>
    <div class="content" id="content"><div class="connecting">Loading your tasks…</div></div>
  </main>
</div>

<div class="auth" id="auth">
  <form class="card" id="authForm">
    <h2><span class="logo">✓</span>Tasks</h2>
    <p id="authSub">Sign in to see your tasks on any device.</p>
    <div class="field"><label>Email</label><input id="au_email" type="email" autocomplete="email" required></div>
    <div class="field"><label>Password</label><input id="au_pass" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="go" id="au_go" type="submit">Sign in</button>
    <div class="msg" id="au_msg"></div>
    <div style="margin-top:12px;font-size:13px;color:var(--muted)"><span id="au_q">No account yet?</span> <button type="button" class="swap" id="au_swap">Create one</button></div>
  </form>
</div>

<nav class="tabbar" id="tabbar"></nav>
<button class="fab" id="fab" aria-label="New task"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
<div class="sidescrim" id="sidescrim"></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="gtip" id="gtip"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const STATUSES = [['todo','To do'],['doing','Doing'],['waiting','Waiting'],['done','Done']];
  const VIEWS = {
    today:{t:'Today'}, upcoming:{t:'Upcoming'}, all:{t:'All tasks'}, timeline:{t:'Timeline'}, board:{t:'Board'},
    waiting:{t:'Waiting on'}, done:{t:'Completed'}   // reached from the tabs on "All tasks"
  };
  const NAV = ['today','upcoming','all','timeline','board'];
  const navOf = v => (v === 'waiting' || v === 'done') ? 'all' : v;
  const ICON = {
    today:'<circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/>',
    upcoming:'<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.6h12M5.3 1.6v2.8M10.7 1.6v2.8"/>',
    all:'<path d="M6 4h8M6 8h8M6 12h8"/><path d="M2.4 4h.2M2.4 8h.2M2.4 12h.2" stroke-width="2.2"/>',
    timeline:'<path d="M2.5 3.5h6M5.5 8h8M3.5 12.5h5" stroke-width="2.4"/>',
    board:'<rect x="2" y="2.5" width="3.4" height="11" rx="1"/><rect x="6.3" y="2.5" width="3.4" height="7" rx="1"/><rect x="10.6" y="2.5" width="3.4" height="9" rx="1"/>',
    plus:'<path d="M8 3v10M3 8h10"/>',
    out:'<path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6M10.5 11 13.5 8l-3-3M13.5 8H6"/>'
  };
  const ico = k => `<span class="ico"><svg viewBox="0 0 16 16">${ICON[k]}</svg></span>`;
  const D = document.getElementById('drawer');

  // ---------- dates ----------
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const todayStr = () => ymd(new Date());
  const dayDiff = s => Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000);
  function dueLabel(s){
    const n = dayDiff(s), d = parseYmd(s);
    if (n < 0) return {txt: n === -1 ? 'Yesterday' : `${-n}d overdue`, cls:'over'};
    if (n === 0) return {txt:'Today', cls:'today'};
    if (n === 1) return {txt:'Tomorrow', cls:''};
    if (n < 7) return {txt:`${DAYS[d.getDay()][0].toUpperCase()+DAYS[d.getDay()].slice(1)} · ${n}d`, cls:''};
    return {txt:`${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' '+d.getFullYear() : ''} · ${n}d`, cls:''};
  }

  // ---------- quick-add parser ----------
  function parseQuick(text){
    const out = {title:'', project:'', priority:0, due:null};
    const words = [], base = new Date();
    const toks = text.trim().split(/\s+/);
    for (let i = 0; i < toks.length; i++){
      const t = toks[i], lo = t.toLowerCase();
      let m;
      if (/^#[\w\-.]+$/.test(t)) { out.project = t.slice(1); continue; }
      if ((m = lo.match(/^!(1|2|3|h|high|m|med|medium|l|low)$/))) { out.priority = ({1:3,h:3,high:3,2:2,m:2,med:2,medium:2,3:1,l:1,low:1})[m[1]]; continue; }
      if (lo === 'today' || lo === 'tdy') { out.due = ymd(base); continue; }
      if (lo === 'tmr' || lo === 'tomorrow' || lo === 'tmrw') { out.due = ymd(addDays(base,1)); continue; }
      if (lo === 'nextweek' || (lo === 'next' && (toks[i+1]||'').toLowerCase() === 'week')) { if (lo === 'next') i++; out.due = ymd(addDays(base, ((8 - base.getDay()) % 7) || 7)); continue; }
      const di = DAYS.findIndex(d => lo === d || lo === d + (d==='wed'?'nesday':d==='thu'?'rsday':d==='tue'?'sday':d==='sat'?'urday':'day'));
      if (di >= 0) { let n = (di - base.getDay() + 7) % 7; if (n === 0) n = 7; out.due = ymd(addDays(base,n)); continue; }
      if ((m = lo.match(/^in(\d+)d$/))) { out.due = ymd(addDays(base, +m[1])); continue; }
      if ((m = lo.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { out.due = ymd(new Date(+m[1], m[2]-1, +m[3])); continue; }
      if ((m = lo.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))) {
        let y = m[3] ? +m[3] : base.getFullYear(); if (y < 100) y += 2000;
        let d = new Date(y, m[2]-1, +m[1]);
        if (!m[3] && d < parseYmd(todayStr())) d = new Date(y+1, m[2]-1, +m[1]);
        if (!isNaN(d)) { out.due = ymd(d); continue; }
      }
      words.push(t);
    }
    out.title = words.join(' ');
    return out;
  }

  // ---------- state ----------
  const state = { tasks:new Map(), view:'today', project:null, search:'', openId:null, mode:'loading' };
  const PRI = {3:'High',2:'Medium',1:'Low',0:'None'};
  const projHue = name => { let h = 0; for (const c of name) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
  const projColor = name => `hsl(${projHue(name)} 60% 52%)`;
  const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  // ---------- Supabase config ----------
  // The publishable key is safe to ship in a public page: row-level security
  // means each signed-in user can only read and write their own tasks.
  const SUPABASE_URL = 'https://ogxuwchojexznsxvvdhi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_pB5HMEXMjVDQiNcWlenV1A_ETc2qaNP';
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  // ---------- row <-> task ----------
  const fromRow = r => ({
    id:r.id, title:r.title, notes:r.notes||'', project:r.project||'', priority:r.priority||0, due:r.due||null,
    start: 'start_date' in r ? (r.start_date || null) : undefined,   // undefined = column not in DB yet
    status:r.status||'todo', waitingOn:r.waiting_on||'', subtasks:Array.isArray(r.subtasks) ? r.subtasks.map(s=>({...s})) : [],
    star:!!r.star, createdAt:Date.parse(r.created_at)||Date.now(), doneAt:r.done_at ? Date.parse(r.done_at) : null,
    updatedAt:Date.parse(r.updated_at)||0
  });
  const toRow = t => ({
    id:t.id, title:t.title, notes:t.notes||'', project:t.project||'', priority:t.priority||0, due:t.due||null, start_date:t.start||null,
    status:t.status||'todo', waiting_on:t.waitingOn||'', subtasks:t.subtasks||[], star:!!t.star,
    created_at:new Date(t.createdAt||Date.now()).toISOString(), done_at:t.doneAt ? new Date(t.doneAt).toISOString() : null,
    updated_at:new Date(t.updatedAt||Date.now()).toISOString()
  });

  // ---------- storage ----------
  const Store = {
    userId:null, chains:{}, channel:null, hasStart:true,
    cacheKey(){ return 'tm.cache.' + this.userId; },
    loadCache(){ try { const raw = localStorage.getItem(this.cacheKey()); if (raw) for (const t of JSON.parse(raw)) state.tasks.set(t.id, t); } catch(e){} },
    saveCache(){ try { localStorage.setItem(this.cacheKey(), JSON.stringify([...state.tasks.values()])); } catch(e){} },
    queue(id, fn){
      const run = async () => {
        let { error } = await fn();
        if (error && !error.code) { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); ({ error } = await fn()); }
        if (error) { console.error(error); toast('Couldn’t save — check your connection.'); setSync('error'); }
        else setSync('ok');
      };
      const p = (this.chains[id] || Promise.resolve()).then(run, run);
      this.chains[id] = p; return p;
    },
    put(t){
      t.updatedAt = Date.now();
      state.tasks.set(t.id, t); this.saveCache(); render();
      const row = toRow(t);
      return this.queue(t.id, () => this.upsert(row));
    },
    async upsert(row){
      if (!this.hasStart) { row = { ...row }; delete row.start_date; }
      let r = await sb.from('tasks').upsert(row, { onConflict:'id' });
      // older database without the start_date column: keep start dates on this device only
      if (r.error && this.hasStart && /start_date/.test(r.error.message || '')) {
        this.hasStart = false; row = { ...row }; delete row.start_date;
        r = await sb.from('tasks').upsert(row, { onConflict:'id' });
      }
      return r;
    },
    remove(id){
      state.tasks.delete(id); this.saveCache(); render();
      this.queue(id, () => sb.from('tasks').delete().eq('id', id));
    },
    async fetchAll(){
      const { data, error } = await sb.from('tasks').select('*').order('created_at');
      if (error) { banner('Can’t reach your tasks right now — showing the copy saved on this device.'); setSync('error'); return; }
      const m = new Map();
      if (data.length && !('start_date' in data[0])) this.hasStart = false;
      for (const r of data) { const t = fromRow(r); if (t.start === undefined) t.start = state.tasks.get(t.id)?.start ?? null; m.set(r.id, t); }
      // keep any local edit that is newer than the server copy (e.g. a save still in flight)
      for (const [id, t] of state.tasks) { const s = m.get(id); if (s && t.updatedAt > s.updatedAt) m.set(id, t); }
      state.tasks = m; this.saveCache(); banner(''); setSync('ok');
      if (state.openId && !m.has(state.openId)) closeDrawer();
      render();
    },
    subscribe(){
      if (this.channel) sb.removeChannel(this.channel);
      this.channel = sb.channel('tasks-' + this.userId)
        .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, p => {
          if (p.eventType === 'DELETE') {
            if (state.tasks.delete(p.old.id)) { if (state.openId === p.old.id) closeDrawer(); this.saveCache(); render(); }
            return;
          }
          const t = fromRow(p.new), cur = state.tasks.get(t.id);
          if (cur && cur.updatedAt >= t.updatedAt) return;   // our own echo, or older than what we have
          if (t.start === undefined) t.start = cur?.start ?? null;
          state.tasks.set(t.id, t); this.saveCache();
          if (state.openId === t.id && !document.querySelector('#drawer :focus')) renderDrawer();
          render();
        })
        .subscribe();
    }
  };

  let syncState = 'ok';
  function setSync(s){ if (s !== syncState) { syncState = s; renderSide(); } }

  async function startSession(session){
    $('#auth').classList.remove('show');
    Store.userId = session.user.id;
    state.email = session.user.email || '';
    state.tasks = new Map();
    Store.loadCache();
    state.mode = 'db';
    render();
    await Store.fetchAll();
    Store.subscribe();
  }
  function showAuth(){
    state.mode = 'loading'; state.tasks = new Map(); closeDrawer();
    if (Store.channel) { sb.removeChannel(Store.channel); Store.channel = null; }
    $('#auth').classList.add('show');
    render();
  }

  async function connect(){
    if (!sb) { $('#content').innerHTML = `<div class="empty"><b>Couldn’t load</b>Check your internet connection and reload.</div>`; return; }
    const { data:{ session } } = await sb.auth.getSession();
    if (session) startSession(session); else showAuth();
    sb.auth.onAuthStateChange((evt, s) => {
      if (evt === 'SIGNED_OUT') showAuth();
      else if (evt === 'SIGNED_IN' && s && s.user.id !== Store.userId) startSession(s);
    });
    // phones pause pages in the background — catch up when it comes back
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.userId && state.mode === 'db') Store.fetchAll(); });
    window.addEventListener('online', () => { if (Store.userId) Store.fetchAll(); });
  }

  // ---------- auth form ----------
  let signUpMode = false;
  function setAuthMode(up){
    signUpMode = up;
    $('#au_go').textContent = up ? 'Create account' : 'Sign in';
    $('#au_q').textContent = up ? 'Already have an account?' : 'No account yet?';
    $('#au_swap').textContent = up ? 'Sign in' : 'Create one';
    $('#au_pass').autocomplete = up ? 'new-password' : 'current-password';
    $('#authSub').textContent = up ? 'Make an account to keep your tasks synced.' : 'Sign in to see your tasks on any device.';
    authMsg('');
  }
  function authMsg(t, cls='err'){ const m = $('#au_msg'); m.textContent = t; m.className = 'msg ' + cls; }
  $('#au_swap').addEventListener('click', () => setAuthMode(!signUpMode));
  $('#authForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#au_email').value.trim(), password = $('#au_pass').value;
    const btn = $('#au_go'); btn.disabled = true; authMsg('');
    try {
      if (signUpMode) {
        const { data, error } = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.href.split('#')[0] } });
        if (error) throw error;
        if (!data.session) { authMsg('Check your email to confirm your account, then sign in here.', 'ok'); setAuthMode(false); authMsg('Check your email to confirm your account, then sign in here.', 'ok'); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch(err) {
      authMsg(err.message || 'Something went wrong');
    } finally { btn.disabled = false; }
  });

  // ---------- selectors ----------
  const open = t => t.status !== 'done';
  const sortTasks = arr => arr.sort((a,b) =>
    (b.star?1:0) - (a.star?1:0) ||
    (a.due||'9999') .localeCompare(b.due||'9999') ||
    (b.priority||0) - (a.priority||0) ||
    (a.createdAt||0) - (b.createdAt||0));
  function matches(t){
    if (state.project && t.project !== state.project) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!(`${t.title} ${t.notes||''} ${t.project||''} ${t.waitingOn||''}`.toLowerCase().includes(q))) return false;
    }
    return true;
  }
  const all = () => [...state.tasks.values()];
  const counts = () => {
    const ts = all(), T = todayStr();
    return {
      today: ts.filter(t => open(t) && ((t.due && t.due <= T) || t.star)).length,
      overdue: ts.filter(t => open(t) && t.due && t.due < T).length,
      upcoming: ts.filter(t => open(t) && t.due && t.due > T).length,
      all: ts.filter(open).length,
      waiting: ts.filter(t => t.status === 'waiting').length,
      board: ts.filter(open).length,
      done: ts.filter(t => t.status === 'done').length,
    };
  };
  const projects = () => {
    const m = new Map();
    for (const t of all()) if (t.project) m.set(t.project, (m.get(t.project)||0) + (open(t)?1:0));
    return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0]));
  };

  // ---------- render ----------
  function render(){ renderSide(); renderMain(); }

  function renderSide(){
    const c = counts(), cur = state.project ? null : navOf(state.view);
    const badge = v => v === 'today' && c.today ? `<span class="ct ${c.overdue ? 'badge' : ''}" title="${c.overdue ? c.overdue + ' overdue' : ''}">${c.today}</span>` : '';
    const ps = projects();
    const online = state.mode === 'db' && syncState === 'ok';
    $('#side').innerHTML = `
      <div class="brand"><span class="logo">✓</span>Tasks</div>
      <button class="newbtn" id="newTask" title="New task (Shift+N)">${ico('plus')}New task<kbd>⇧N</kbd></button>
      <div class="nav">${NAV.map(v => `<button data-view="${v}" class="${cur === v ? 'on' : ''}">${ico(v)}${VIEWS[v].t}${badge(v)}</button>`).join('')}</div>
      <div class="nav"><h4>Projects</h4>${ps.length ? ps.map(([p,n]) =>
        `<button data-project="${esc(p)}" class="${state.project===p?'on':''}"><span class="ico"><span class="dot" style="background:${projColor(p)}"></span></span>${esc(p)}<span class="ct">${n||''}</span></button>`).join('')
        : `<div class="phint">Type <code>#name</code> in a task to group it into a project.</div>`}</div>
      ${state.mode === 'db' ? `<div class="acct ${online ? '' : 'off'}"><span class="av">${esc((state.email||'?')[0])}<i></i></span>
        <span class="em"><b title="${esc(state.email||'')}">${esc(state.email||'')}</b><span>${online ? 'All changes synced' : 'Offline — will retry'}</span></span>
        <button id="signout" title="Sign out">${'<span class="ico"><svg viewBox="0 0 16 16">' + ICON.out + '</svg></span>'}</button></div>`
        : `<div class="acct off"><span class="em"><span>Connecting…</span></span></div>`}`;
    $('#tabbar').innerHTML = NAV.map(v => `<button data-view="${v}" class="${cur === v ? 'on' : ''}">${ico(v)}${v === 'all' ? 'All' : VIEWS[v].t}${v === 'today' && c.overdue ? `<span class="tb">${c.overdue}</span>` : ''}</button>`).join('');
  }

  function taskRow(t, opts = {}){
    const meta = [];
    if (t.status === 'doing') meta.push(`<span class="doing">● Doing</span>`);
    if (t.due) { const d = dueLabel(t.due); meta.push(`<span class="due ${t.status==='done'?'':d.cls}">◷ ${d.txt}</span>`); }
    if (t.project && !state.project) meta.push(`<span class="chip"><span class="dot" style="background:${projColor(t.project)}"></span>${esc(t.project)}</span>`);
    if (t.status === 'waiting') meta.push(`<span class="wait">⏳ ${t.waitingOn ? esc(t.waitingOn) : 'Waiting'}</span>`);
    if (t.subtasks && t.subtasks.length) meta.push(`<span>☑ ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>`);
    if (t.notes) meta.push(`<span title="Has notes">✎</span>`);
    return `<div class="task ${t.status==='done'?'done':''} ${state.openId===t.id?'sel':''}" data-id="${t.id}" ${opts.drag?'draggable="true"':''}>
      <button class="check p${t.priority||0}" data-act="toggle" title="Mark done">${t.status==='done'?'✓':''}</button>
      <div class="body"><div class="ttl">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>
      ${t.status!=='done'?`<button class="star ${t.star?'on':''}" data-act="star" title="${t.star?'Remove from Today':'Pin to Today'}">★</button>`:''}
    </div>`;
  }
  const group = (title, arr, cls='') => arr.length ? `<div class="group ${cls}"><h3>${title}<span class="n">${arr.length}</span></h3>${arr.map(t=>taskRow(t)).join('')}</div>` : '';
  const empty = (b, s) => `<div class="empty"><b>${b}</b>${s}</div>`;

  function renderMain(){
    const T = todayStr();
    const title = state.project ? '# ' + state.project : VIEWS[navOf(state.view)].t;
    $('#vtitle').textContent = title;
    const now = new Date();
    $('#vsub').textContent = state.view === 'today' && !state.project ? `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()]}, ${now.getDate()} ${MON[now.getMonth()]}` : '';
    const cc = counts();
    $('#vtabs').innerHTML = state.project ? [['all','List'],['timeline','Timeline'],['board','Board']].map(([v,l]) =>
      `<button data-v="${v}" class="${state.view===v || (v==='all' && !['timeline','board'].includes(state.view)) ? 'on':''}">${l}</button>`).join('')
      : navOf(state.view) === 'all' ? [['all','Open',cc.all],['waiting','Waiting',cc.waiting],['done','Completed',cc.done]].map(([v,l,n]) =>
      `<button data-v="${v}" class="${state.view===v ? 'on':''}">${l}${n ? ` <span style="opacity:.55;font-family:var(--mono);font-size:11px">${n}</span>` : ''}</button>`).join('') : '';
    const el = $('#content');
    el.classList.toggle('tl', state.view === 'timeline');
    if (state.mode === 'loading') { el.innerHTML = `<div class="connecting">Loading your tasks…</div>`; return; }
    if (gdrag) { pendingRender = true; return; }   // don't pull the bar out from under the pointer
    const gw = $('#gwrap'), keep = gw ? { l:gw.scrollLeft, t:gw.scrollTop, start:G.start, dw:G.dw } : null;
    const ts = all().filter(matches);
    let html = '';

    if (state.view === 'timeline') {
      el.innerHTML = renderTimeline(ts);
      afterTimeline(keep);
      return;
    } else if (state.view === 'board') {
      html = `<div class="board">${STATUSES.map(([s,label]) => {
        let arr = ts.filter(t => (t.status||'todo') === s);
        arr = s === 'done' ? arr.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,30) : sortTasks(arr);
        return `<div class="col" data-col="${s}"><h3>${label}<span class="n">${arr.length}</span></h3>${arr.map(t=>taskRow(t,{drag:true})).join('')}</div>`;
      }).join('')}</div>`;
    } else if (state.project) {
      const o = sortTasks(ts.filter(open)), d = ts.filter(t => t.status==='done');
      html = o.length || d.length ? group('Doing', o.filter(t=>t.status==='doing')) + group('To do', o.filter(t=>t.status==='todo' || !t.status)) + group('Waiting', o.filter(t=>t.status==='waiting')) + group('Completed', d.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)))
        : empty('No tasks in this project', 'Add one above — the project tag is filled in for you.');
    } else if (state.view === 'today') {
      const o = sortTasks(ts.filter(open));
      const over = o.filter(t => t.due && t.due < T);
      const tod = o.filter(t => (t.due === T) || (t.star && !(t.due && t.due < T)));
      const doneToday = ts.filter(t => t.status==='done' && t.doneAt && ymd(new Date(t.doneAt)) === T);
      html = group('Overdue', over, 'overdue') + group('Today', tod) + group('Done today', doneToday);
      if (!over.length && !tod.length) html = empty('Nothing due today', 'Add a task with <code>today</code>, or tap ★ on any task to pin it here.') + group('Done today', doneToday);
    } else if (state.view === 'upcoming') {
      const o = sortTasks(ts.filter(t => open(t) && t.due && t.due > T));
      const byDate = new Map();
      for (const t of o) { const n = dayDiff(t.due); const k = n < 8 ? t.due : n < 31 ? 'Later this month' : 'Later'; if (!byDate.has(k)) byDate.set(k, []); byDate.get(k).push(t); }
      for (const [k, arr] of byDate) {
        const label = /^\d/.test(k) ? (()=>{ const d = parseYmd(k); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; })() : k;
        html += group(label, arr);
      }
      if (!o.length) html = empty('Nothing scheduled', 'Tasks with a future due date show up here.');
    } else if (state.view === 'all') {
      const o = sortTasks(ts.filter(open));
      html = group('Doing', o.filter(t=>t.status==='doing')) + group('To do', o.filter(t=>t.status==='todo'||!t.status)) + group('Waiting', o.filter(t=>t.status==='waiting'));
      if (!o.length) html = empty('No open tasks', 'Type a task in the box above and press Enter.');
    } else if (state.view === 'waiting') {
      const o = sortTasks(ts.filter(t => t.status === 'waiting'));
      html = o.length ? group('Waiting on someone or something', o) : empty('Nothing blocked', 'Set a task’s status to Waiting when you’re held up by a supplier, an approval or a delivery.');
    } else if (state.view === 'done') {
      const d = ts.filter(t => t.status==='done').sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
      html = d.length ? `<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn danger" id="clearDone">Delete all completed</button></div>` + group('Completed', d) : empty('Nothing completed yet', 'Finished tasks land here.');
    }
    el.innerHTML = html;
  }

  // ---------- timeline (Gantt) ----------
  const ZOOMS = { day:{dw:34, l:'Days'}, week:{dw:14, l:'Weeks'}, month:{dw:4, l:'Months'} };
  const gp = (() => { try { return JSON.parse(localStorage.getItem('tm.gantt')) || {}; } catch(e){ return {}; } })();
  const G = { zoom: ZOOMS[gp.zoom] ? gp.zoom : 'day', showDone: !!gp.showDone, group: gp.group !== false,
    collapsed: new Set(gp.collapsed || []), start: null, dw: 34, days: 0, didScroll: false };
  const saveG = () => { try { localStorage.setItem('tm.gantt', JSON.stringify({ zoom:G.zoom, showDone:G.showDone, group:G.group, collapsed:[...G.collapsed] })); } catch(e){} };
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const span = t => { const s = t.start || t.due, e = t.due || t.start; if (!s) return null; return s <= e ? {s, e} : {s:e, e:s}; };
  const dIdx = s => Math.round((parseYmd(s) - G.start) / 864e5);
  const fmtD = s => { const d = parseYmd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
  const fmtDL = s => { const d = parseYmd(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
  const durDays = (s, e) => Math.round((parseYmd(e) - parseYmd(s)) / 864e5) + 1;
  let gdrag = null, pendingRender = false;

  function renderTimeline(ts){
    G.dw = ZOOMS[G.zoom].dw;
    const T = todayStr();
    const list = ts.filter(t => G.showDone || t.status !== 'done');
    let lo = parseYmd(T), hi = parseYmd(T);
    for (const t of list) { const sp = span(t); if (!sp) continue; const a = parseYmd(sp.s), b = parseYmd(sp.e); if (a < lo) lo = a; if (b > hi) hi = b; }
    const pad = { day:[14,45], week:[28,100], month:[60,200] }[G.zoom];
    lo = addDays(lo, -pad[0]); lo = addDays(lo, -((lo.getDay() + 6) % 7));   // start on a Monday
    hi = addDays(hi, pad[1]);
    let n = Math.round((hi - lo) / 864e5) + 1;
    n = Math.ceil(Math.max(n, Math.ceil(2400 / G.dw)) / 7) * 7;
    G.start = lo; G.days = n;
    const todayX = dIdx(T) * G.dw;

    const ordered = arr => arr.sort((a, b) => {
      const sa = span(a), sb2 = span(b);
      if (!!sa !== !!sb2) return sa ? -1 : 1;
      if (sa) return sa.s.localeCompare(sb2.s) || sa.e.localeCompare(sb2.e) || (a.createdAt||0) - (b.createdAt||0);
      return (a.createdAt||0) - (b.createdAt||0);
    });
    let rows = '';
    if (G.group && !state.project) {
      const m = new Map();
      for (const t of list) { const k = t.project || ''; if (!m.has(k)) m.set(k, []); m.get(k).push(t); }
      const keys = [...m.keys()].sort((a, b) => (a === '') - (b === '') || a.localeCompare(b));
      for (const k of keys) {
        rows += gGroupRow(k, m.get(k));
        if (!G.collapsed.has(k)) rows += ordered(m.get(k)).map(t => gRow(t, todayX)).join('');
      }
    } else rows = ordered(list).map(t => gRow(t, todayX)).join('');
    rows += `<div class="grow gadd"><div class="gl" data-add="1"><div class="gn">＋ Add task</div></div><div class="gr"></div></div>`;

    const zbtn = Object.entries(ZOOMS).map(([k, z]) => `<button data-z="${k}" class="${G.zoom===k?'on':''}">${z.l}</button>`).join('');
    return `<div class="gtool">
        <div class="zseg">${zbtn}</div>
        <button class="btn sm" data-g="today">Go to today</button>
        <span class="sp"></span>
        ${!state.project ? `<label><input type="checkbox" data-g="group" ${G.group?'checked':''}> Group by project</label>` : ''}
        <label><input type="checkbox" data-g="done" ${G.showDone?'checked':''}> Show completed</label>
        <span class="ghelp">Drag a bar to move it · drag its ends to change start/finish · click an empty row to schedule it · click a name to edit</span>
      </div>
      <div class="gwrap z${G.zoom}" id="gwrap" style="--dw:${G.dw}px;--gw:${n * G.dw}px"><div class="gin">
        ${gHead()}${rows}
        ${list.length ? '' : '<div class="gempty">No tasks yet — add one with the box above or “＋ Add task”.</div>'}
        <div class="gtoday" style="left:calc(var(--lw) + ${todayX + G.dw / 2 - 1}px)"></div>
      </div></div>`;
  }

  function gHead(){
    const segs = (keyFn, labelFn, clsFn) => {
      let out = '', i = 0;
      while (i < G.days) {
        const k = keyFn(i, addDays(G.start, i)); let j = i + 1;
        while (j < G.days && keyFn(j, addDays(G.start, j)) === k) j++;
        const d = addDays(G.start, i), w = (j - i) * G.dw;
        out += `<div class="${clsFn ? clsFn(d) : ''}" style="left:${i * G.dw}px;width:${w}px">${labelFn(d, w)}</div>`;
        i = j;
      }
      return out;
    };
    const T = todayStr();
    const monthKey = (i, d) => d.getFullYear() * 12 + d.getMonth();
    let top, bot;
    if (G.zoom === 'month') {
      top = segs((i, d) => d.getFullYear(), d => d.getFullYear());
      bot = segs(monthKey, (d, w) => w > 26 ? MON[d.getMonth()] : '');
    } else {
      top = segs(monthKey, (d, w) => w > 70 ? `${MON[d.getMonth()]} ${d.getFullYear()}` : w > 26 ? MON[d.getMonth()] : '');
      bot = G.zoom === 'day'
        ? segs(i => i, d => `${d.getDate()}<small>${WD[d.getDay()][0]}</small>`, d => ymd(d) === T ? 'td' : (d.getDay() % 6 === 0 ? 'wk' : ''))
        : segs(i => Math.floor(i / 7), d => `${d.getDate()} ${MON[d.getMonth()]}`);
    }
    return `<div class="grow ghead"><div class="gl"><div class="gn">Task name</div><div class="num">Start</div><div class="num">Finish</div><div class="num">Dur</div></div>
      <div class="gr"><div class="gh1">${top}</div><div class="gh2">${bot}</div></div></div>`;
  }

  function gRow(t, todayX){
    const sp = span(t), done = t.status === 'done';
    const pri = t.priority ? `var(--p${4 - t.priority})` : 'var(--line)';
    const left = `<div class="gl" data-id="${t.id}" title="${esc(t.title)} — click to edit"><div class="gn"><span class="dot" style="background:${pri}"></span><span class="${done?'strike':''}">${esc(t.title)}</span></div>
      <div class="num">${sp ? fmtD(sp.s) : '—'}</div><div class="num">${sp ? fmtD(sp.e) : '—'}</div><div class="num">${sp ? durDays(sp.s, sp.e) + 'd' : ''}</div></div>`;
    let right;
    if (sp) {
      const x = dIdx(sp.s) * G.dw, w = durDays(sp.s, sp.e) * G.dw;
      const subs = t.subtasks || [];
      const pct = done ? 100 : subs.length ? Math.round(subs.filter(s => s.done).length / subs.length * 100) : 0;
      const over = !done && sp.e < todayStr();
      right = `<div class="gr" data-id="${t.id}"><div class="bar ${done?'done':''} ${over?'over':''}" style="left:${x}px;width:${w}px;--bc:${t.project ? projColor(t.project) : 'var(--accent)'}">
        ${pct ? `<div class="pg" style="width:${pct}%"></div>` : ''}<div class="hl"></div><div class="hr"></div><span class="bl">${esc(t.title)}${pct && !done ? ` · ${pct}%` : ''}</span></div></div>`;
    } else {
      right = `<div class="gr unsched" data-id="${t.id}"><span class="hintx" style="left:${todayX + 8}px">Not scheduled — click or drag here to set dates</span></div>`;
    }
    return `<div class="grow ${state.openId === t.id ? 'sel' : ''}">${left}${right}</div>`;
  }

  function gGroupRow(k, arr){
    const sps = arr.map(span).filter(Boolean), col = G.collapsed.has(k);
    let sum = '', s = '', e = '';
    if (sps.length) {
      s = sps.reduce((m, x) => x.s < m ? x.s : m, sps[0].s); e = sps.reduce((m, x) => x.e > m ? x.e : m, sps[0].e);
      sum = `<div class="sumbar" style="left:${dIdx(s) * G.dw}px;width:${durDays(s, e) * G.dw}px"></div>`;
    }
    return `<div class="grow ggrp"><div class="gl" data-grp="${esc(k)}" title="Click to ${col ? 'expand' : 'collapse'}"><div class="gn"><span class="caret">${col ? '▶' : '▼'}</span>${k ? `<span class="dot" style="background:${projColor(k)}"></span>${esc(k)}` : 'No project'}<span class="n">${arr.length}</span></div>
      <div class="num">${s ? fmtD(s) : ''}</div><div class="num">${e ? fmtD(e) : ''}</div><div class="num">${s ? durDays(s, e) + 'd' : ''}</div></div><div class="gr">${sum}</div></div>`;
  }

  function fitGantt(){
    const w = $('#gwrap'); if (!w) return;
    w.style.maxHeight = Math.max(260, window.innerHeight - w.getBoundingClientRect().top - 18) + 'px';
  }
  function scrollToToday(smooth){
    const w = $('#gwrap'); if (!w) return;
    const lw = parseFloat(getComputedStyle(w).getPropertyValue('--lw')) || 380;
    w.scrollTo({ left: Math.max(0, dIdx(todayStr()) * G.dw - (w.clientWidth - lw) * 0.2), behavior: smooth ? 'smooth' : 'auto' });
  }
  function afterTimeline(keep){
    const w = $('#gwrap'); if (!w) return;
    fitGantt();
    if (keep && G.didScroll && keep.dw === G.dw) {
      w.scrollLeft = keep.l + Math.round((keep.start - G.start) / 864e5) * G.dw;   // range may have grown on the left
      w.scrollTop = keep.t;
    } else { scrollToToday(); G.didScroll = true; }
  }
  window.addEventListener('resize', fitGantt);

  function gtip(e, s, en){
    const tip = $('#gtip');
    if (!e) { tip.style.display = 'none'; return; }
    tip.textContent = `${fmtDL(s)} → ${fmtDL(en)} · ${durDays(s, en)} day${durDays(s, en) > 1 ? 's' : ''}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY - 38) + 'px';
  }

  // ---------- drawer ----------
  // One editor for both: a side drawer for existing tasks, a centred dialog for new ones.
  const cur = () => state.creating ? state.draft : state.tasks.get(state.openId);
  function dropCreateLook(){
    D.style.transition = 'none'; D.classList.remove('create'); void D.offsetWidth; D.style.transition = '';
  }
  function openDrawer(id){
    if (state.creating) { state.creating = false; state.draft = null; D.classList.remove('open'); dropCreateLook(); $('#scrim').classList.remove('show'); }
    state.openId = id; renderDrawer(); D.classList.add('open'); renderMain();
  }
  function openCreate(pre = {}){
    if (state.openId) { flushTyping(); state.openId = null; D.classList.remove('open'); }
    const tv = state.view === 'today' && !state.project;
    state.draft = { id:uid(), title:'', project:state.project || '', priority:0, due: tv ? todayStr() : null, start:null,
      status: state.view === 'waiting' && !state.project ? 'waiting' : 'todo', notes:'', waitingOn:'', subtasks:[], star:false,
      createdAt:Date.now(), doneAt:null, ...pre };
    state.creating = true; D.dataset.for = '';
    D.style.transition = 'none'; D.classList.add('create'); void D.offsetWidth; D.style.transition = '';
    renderDrawer();
    D.classList.add('open'); $('#scrim').classList.add('show');
    renderMain();
    setTimeout(() => { const f = $('#f_title'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 60);
  }
  function closeDrawer(){
    const wasCreate = state.creating;
    state.openId = null; state.creating = false; state.draft = null;
    D.classList.remove('open'); $('#scrim').classList.remove('show');
    if (wasCreate) setTimeout(() => { if (!state.creating) dropCreateLook(); }, 180);
    renderMain();
  }
  function createDraft(){
    flushTyping();
    const d = state.draft; if (!d) return;
    d.title = (d.title || '').trim();
    if (!d.title) { const f = $('#f_title'); f.classList.add('need'); f.focus(); $('#titleErr').textContent = 'Give the task a name first.'; return; }
    if (d.status === 'done') d.doneAt = Date.now();
    const t = { ...d };
    closeDrawer(); Store.put(t);
    toast(`Added “${t.title}”${t.due ? ' · ' + dueLabel(t.due).txt : ''}`, 'Open', () => openDrawer(t.id));
  }

  // keep a schedule consistent the way Project does: moving the start keeps the duration
  function schedPatch(t, field, v){
    const p = {};
    if (field === 'start') {
      p.start = v || null;
      if (v && t.start && t.due) p.due = ymd(addDays(parseYmd(v), durDays(t.start, t.due) - 1));
      else if (v && t.due && v > t.due) p.due = v;
    } else if (field === 'due') {
      p.due = v || null;
      if (v && t.start && v < t.start) p.start = v;
    } else if (field === 'dur') {
      const n = Math.max(1, Math.min(3650, Math.round(+v || 1)));
      const s = t.start || (t.due ? ymd(addDays(parseYmd(t.due), -(n - 1))) : todayStr());
      p.start = s; p.due = ymd(addDays(parseYmd(s), n - 1));
    }
    return p;
  }

  function renderDrawer(){
    const t = cur(); if (!t) return;
    const c = state.creating, key = c ? 'new' : t.id;
    if (D.dataset.for === key) flushTyping();
    const ps = projects().map(([p]) => p);
    const projOpts = ps.map(p => `<option value="${esc(p)}">`).join('');
    const sp = span(t), dur = sp ? durDays(sp.s, sp.e) : '';
    const base = new Date(), T = todayStr();
    const qd = [['Today', T], ['Tomorrow', ymd(addDays(base, 1))], ['Friday', ymd(addDays(base, (5 - base.getDay() + 7) % 7))],
      ['Next Monday', ymd(addDays(base, ((8 - base.getDay()) % 7) || 7))], ['In 2 weeks', ymd(addDays(base, 14))]];
    const prow = ps.length ? `<div class="qchips">${ps.slice(0, 10).map(p => `<button type="button" data-proj="${esc(p)}" class="${t.project===p?'on':''}"><span class="dot" style="background:${projColor(p)}"></span>${esc(p)}</button>`).join('')}</div>` : '';
    D.innerHTML = `
      <div class="dhead">${c ? '<b style="font-size:15px">New task</b>'
        : `<span class="chip">${t.status==='done'?'✓ Completed':'Task'}</span><button class="btn sm" data-act="done">${t.status==='done' ? '↺ Reopen' : '✓ Mark complete'}</button>`}
        <button class="x" data-act="close" title="Close (Esc)">×</button></div>
      <div class="dbody">
        <div><textarea class="dtitle" id="f_title" rows="1" placeholder="What needs to be done?">${esc(t.title)}</textarea><div class="err-msg" id="titleErr"></div></div>
        <div class="field"><label>Schedule</label>
          <div class="row3">
            <div class="sl"><span>Start</span><input type="date" id="f_start" value="${t.start||''}"></div>
            <div class="sl"><span>Due / finish</span><input type="date" id="f_due" value="${t.due||''}"></div>
            <div class="sl"><span>Days</span><input type="number" min="1" id="f_dur" value="${dur}" placeholder="–"></div>
          </div>
          <div class="qchips"><span style="font-size:12px;color:var(--faint);align-self:center">Due:</span>${qd.map(([l, v]) => `<button type="button" data-qd="${v}" class="${t.due===v?'on':''}">${l}</button>`).join('')}${t.start || t.due ? '<button type="button" data-qd="">✕ Clear</button>' : ''}</div>
          ${sp ? `<div class="dur-note">${fmtDL(sp.s)} → ${fmtDL(sp.e)} · shows on the Timeline</div>` : ''}
        </div>
        <div class="field"><label>Priority</label><div class="seg pri" id="f_pri">${[0,1,2,3].map(p => `<button type="button" data-p="${p}" class="${(t.priority||0)===p?'on':''}">${p ? `<span class="dot" style="background:var(--p${4-p})"></span>` : ''}${PRI[p]}</button>`).join('')}</div></div>
        <div class="field"><label>Status</label><div class="seg" id="f_status">${STATUSES.map(([s,l]) => `<button type="button" data-s="${s}" class="${(t.status||'todo')===s?'on':''}">${l}</button>`).join('')}</div></div>
        <div class="field" id="waitField" style="${t.status==='waiting'?'':'display:none'}"><label>Waiting on</label><input id="f_wait" placeholder="e.g. Supplier quote, boss approval" value="${esc(t.waitingOn||'')}"></div>
        <div class="field"><label>Project</label><input id="f_proj" list="projList" placeholder="Type a new project, or pick one below" value="${esc(t.project||'')}"><datalist id="projList">${projOpts}</datalist>${prow}</div>
        <div class="field"><label>Checklist</label><div class="subs" id="subs">${(t.subtasks||[]).map((s,i)=>`<div class="s ${s.done?'d':''}"><input type="checkbox" data-i="${i}" ${s.done?'checked':''}><span>${esc(s.t)}</span><button class="rm" data-rm="${i}" title="Remove">×</button></div>`).join('')}</div>
          <form class="subadd" id="subadd"><input id="f_sub" placeholder="Add a step and press Enter…" autocomplete="off"><button class="btn" type="submit">Add</button></form></div>
        <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Links, part numbers, measurements…">${esc(t.notes||'')}</textarea></div>
      </div>
      <div class="dfoot">${c
        ? `<span>Ctrl+Enter to save</span><button class="btn" data-act="close" style="margin-left:auto">Cancel</button><button class="btn primary" id="create">Create task</button>`
        : `<span id="saved">Created ${t.createdAt ? new Date(t.createdAt).toLocaleDateString() : ''} · changes save automatically</span><button class="btn" id="dup" style="margin-left:auto">Duplicate</button><button class="btn danger" id="del">Delete</button>`}</div>`;
    D.dataset.for = key;
    autosize($('#f_title'));
  }
  function autosize(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  function setSaved(s){ const el = $('#saved'); if (el) el.textContent = s; }
  function edit(patch){
    if (state.creating) { if (state.draft) Object.assign(state.draft, patch); return; }
    const t = state.tasks.get(state.openId); if (!t) return;
    const n = { ...t, subtasks:(t.subtasks||[]).map(s=>({...s})), ...patch };
    setSaved('Saving…');
    Store.put(n).then(() => setSaved(syncState === 'ok' ? 'Saved ✓' : 'Not saved yet — retrying'));
  }
  let typingTimer = null;
  function editTyped(patch){
    clearTimeout(typingTimer);
    if (state.creating) { edit(patch); return; }
    typingTimer = setTimeout(() => edit(patch), 500);
  }

  // ---------- actions ----------
  function addTask(raw){
    const p = parseQuick(raw);
    if (!p.title) { toast('Give the task a name'); return; }
    if (!p.project && state.project) p.project = state.project;
    if (!p.due && state.view === 'today' && !state.project) p.due = todayStr();
    const t = { id:uid(), title:p.title, project:p.project, priority:p.priority, due:p.due, status: state.view==='waiting' && !state.project ? 'waiting' : 'todo',
      notes:'', waitingOn:'', subtasks:[], star:false, createdAt:Date.now(), doneAt:null };
    Store.put(t);
    toast(`Added${t.due ? ' · ' + dueLabel(t.due).txt : ''}${t.project ? ' · #' + t.project : ''}`);
  }
  function toggleDone(id){
    const t = state.tasks.get(id); if (!t) return;
    const done = t.status !== 'done';
    Store.put({ ...t, status: done ? 'done' : 'todo', doneAt: done ? Date.now() : null, star: done ? false : t.star });
    if (state.openId === id) renderDrawer();
  }
  function setStatus(id, s){
    const t = state.tasks.get(id); if (!t || (t.status||'todo') === s) return;
    Store.put({ ...t, status:s, doneAt: s==='done' ? Date.now() : null });
  }

  // ---------- UI helpers ----------
  let toastT;
  function toast(msg, act, fn){
    const el = $('#toast');
    el.innerHTML = esc(msg) + (act ? `<button type="button">${esc(act)}</button>` : '');
    if (act) el.querySelector('button').onclick = () => { el.classList.remove('show'); fn(); };
    el.classList.add('show'); clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), act ? 5000 : 2200);
  }
  function banner(msg){ $('#bannerSlot').innerHTML = msg ? `<div class="banner">${esc(msg)}</div>` : ''; }
  function renderHint(){
    const v = $('#qa').value;
    if (!v.trim()) {
      $('#hint').innerHTML = document.activeElement === $('#qa')
        ? `<span>Shortcuts:</span><code>tmr</code><code>fri</code><code>25/12</code><code>in3d</code><span>for dates ·</span><code>#project</code><span>·</span><code>!1</code><span>high priority · or</span><button type="button" id="hintMore" style="background:none;border:0;padding:0;color:var(--accent);font-size:12px">open the full form</button>`
        : '';
      return;
    }
    const p = parseQuick(v), bits = [];
    if (p.due) bits.push(`<span class="chip">◷ ${dueLabel(p.due).txt}</span>`);
    else if (state.view === 'today' && !state.project) bits.push(`<span class="chip">◷ Today</span>`);
    const proj = p.project || state.project;
    if (proj) bits.push(`<span class="chip"><span class="dot" style="background:${projColor(proj)}"></span>${esc(proj)}</span>`);
    if (p.priority) bits.push(`<span class="chip" style="color:var(--p${4-p.priority})">● ${PRI[p.priority]}</span>`);
    $('#hint').innerHTML = bits.join('') || '<span>Press Enter to add</span>';
  }
  function go(view, project = null){
    if (view !== state.view) G.didScroll = false;
    state.view = view; state.project = project;
    if (!project) { try { history.replaceState(null, '', '#' + view); } catch(e){} }
    renderHint(); render();
  }

  // ---------- events ----------
  $('#side').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sideOpen(false);
    if (b.id === 'signout') { sb.auth.signOut(); return; }
    if (b.id === 'newTask') { openCreate(); return; }
    if (b.dataset.view) go(b.dataset.view);
    if (b.dataset.project) go(['timeline','board'].includes(state.view) ? state.view : 'all', b.dataset.project);
  });
  $('#vtabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v, state.project); });
  const sideOpen = on => document.body.classList.toggle('side-open', on);
  $('#menuBtn').addEventListener('click', () => sideOpen(true));
  $('#sidescrim').addEventListener('click', () => sideOpen(false));
  $('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
  $('#fab').addEventListener('click', () => openCreate());
  $('#hint').addEventListener('mousedown', e => { if (e.target.id === 'hintMore') { e.preventDefault(); $('#qmore').click(); } });
  $('#qa').addEventListener('focus', renderHint); $('#qa').addEventListener('blur', () => setTimeout(renderHint, 150));
  $('#scrim').addEventListener('click', () => closeDrawer());
  $('#quick').addEventListener('submit', e => { e.preventDefault(); const v = $('#qa').value; if (!v.trim()) return; addTask(v); $('#qa').value = ''; renderHint(); });
  $('#qmore').addEventListener('click', () => {
    const p = parseQuick($('#qa').value), pre = {};
    if (p.title) pre.title = p.title;
    if (p.project) pre.project = p.project;
    if (p.priority) pre.priority = p.priority;
    if (p.due) pre.due = p.due;
    $('#qa').value = ''; renderHint();
    openCreate(pre);
  });
  $('#qa').addEventListener('input', renderHint);
  $('#search').addEventListener('input', e => { state.search = e.target.value.trim(); renderMain(); });
  $('#main').addEventListener('scroll', () => $('#top').classList.toggle('scrolled', $('#main').scrollTop > 4));

  $('#content').addEventListener('click', e => {
    // timeline toolbar + left-hand task list
    const z = e.target.closest('[data-z]');
    if (z) { G.zoom = z.dataset.z; G.didScroll = false; saveG(); renderMain(); return; }
    if (e.target.closest('button[data-g="today"]')) { scrollToToday(true); return; }
    const gl = e.target.closest('.gl');
    if (gl) {
      if (gl.dataset.id) { openDrawer(gl.dataset.id); return; }
      if (gl.dataset.add) { openCreate(); return; }
      if ('grp' in gl.dataset) { const k = gl.dataset.grp; G.collapsed.has(k) ? G.collapsed.delete(k) : G.collapsed.add(k); saveG(); renderMain(); return; }
      return;
    }
    if (e.target.id === 'clearDone') {
      const b = e.target;
      if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Click again to delete all'; setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Delete all completed'; }, 3000); return; }
      all().filter(t => t.status==='done').forEach(t => Store.remove(t.id)); toast('Completed tasks deleted'); return;
    }
    const row = e.target.closest('.task'); if (!row) return;
    const act = e.target.closest('[data-act]')?.dataset.act, id = row.dataset.id;
    if (act === 'toggle') { e.stopPropagation(); toggleDone(id); return; }
    if (act === 'star') { e.stopPropagation(); const t = state.tasks.get(id); Store.put({ ...t, star: !t.star }); return; }
    openDrawer(id);
  });

  // board drag & drop
  let dragId = null;
  $('#content').addEventListener('dragstart', e => { const r = e.target.closest('.task'); if (!r) return; dragId = r.dataset.id; r.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(_){} });
  $('#content').addEventListener('dragend', e => { e.target.closest('.task')?.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')); });
  $('#content').addEventListener('dragover', e => { const c = e.target.closest('.col'); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); });
  $('#content').addEventListener('drop', e => { const c = e.target.closest('.col'); if (!c || !dragId) return; e.preventDefault(); c.classList.remove('over'); setStatus(dragId, c.dataset.col); dragId = null; });

  $('#content').addEventListener('change', e => {
    const g = e.target.dataset.g;
    if (g === 'group') { G.group = e.target.checked; saveG(); renderMain(); }
    if (g === 'done') { G.showDone = e.target.checked; saveG(); renderMain(); }
  });

  // timeline drag: move a bar, stretch its ends, or draw a new one on an unscheduled row
  $('#content').addEventListener('pointerdown', e => {
    if (e.button) return;
    const gr = e.target.closest('.gr[data-id]'); if (!gr) return;
    const t = state.tasks.get(gr.dataset.id); if (!t) return;
    const bar = e.target.closest('.bar'), sp = span(t);
    let mode;
    if (bar) mode = e.target.closest('.hl') ? 'l' : e.target.closest('.hr') ? 'r' : 'move';
    else if (!sp) mode = 'create';
    else return;
    if (bar) e.preventDefault();
    const rect = gr.getBoundingClientRect();
    const day0 = Math.floor((e.clientX - rect.left) / G.dw);
    let el = bar;
    if (mode === 'create') {
      el = document.createElement('div'); el.className = 'bar ghost'; el.style.display = 'none';
      gr.appendChild(el);
    }
    gdrag = { id:t.id, mode, x0:e.clientX, rect, day0, moved:false, el, gr, pid:e.pointerId,
      s0: sp ? dIdx(sp.s) : day0, e0: sp ? dIdx(sp.e) : day0, s: sp ? dIdx(sp.s) : day0, e: sp ? dIdx(sp.e) : day0 };
    if (bar) { try { gr.setPointerCapture(e.pointerId); } catch(_){} }
  });
  $('#content').addEventListener('pointermove', e => {
    const g = gdrag; if (!g || e.pointerId !== g.pid) return;
    if (!g.moved && Math.abs(e.clientX - g.x0) < 4) return;
    if (!g.moved) { g.moved = true; g.el.classList.add('drag'); g.el.style.display = ''; try { g.gr.setPointerCapture(e.pointerId); } catch(_){} }
    const dd = Math.round((e.clientX - g.x0) / G.dw);
    if (g.mode === 'move') { g.s = g.s0 + dd; g.e = g.e0 + dd; }
    else if (g.mode === 'l') { g.s = Math.min(g.s0 + dd, g.e0); g.e = g.e0; }
    else if (g.mode === 'r') { g.e = Math.max(g.e0 + dd, g.s0); g.s = g.s0; }
    else { const d = Math.floor((e.clientX - g.rect.left) / G.dw); g.s = Math.min(g.day0, d); g.e = Math.max(g.day0, d); }
    g.el.style.left = g.s * G.dw + 'px'; g.el.style.width = (g.e - g.s + 1) * G.dw + 'px';
    gtip(e, ymd(addDays(G.start, g.s)), ymd(addDays(G.start, g.e)));
  });
  function endDrag(e, cancel){
    const g = gdrag; if (!g || e.pointerId !== g.pid) return;
    gdrag = null; gtip(null);
    const t = state.tasks.get(g.id);
    if (cancel || !t) { pendingRender = false; renderMain(); return; }
    if (!g.moved && g.mode !== 'create') { pendingRender = false; openDrawer(g.id); return; }
    const start = ymd(addDays(G.start, g.s)), due = ymd(addDays(G.start, g.e));
    pendingRender = false;
    if (start === t.start && due === t.due) { renderMain(); return; }
    const n = { ...t, start, due };
    Store.put(n);
    if (state.openId === g.id) renderDrawer();
    toast(`${t.title}: ${fmtD(start)} → ${fmtD(due)}`, 'Undo', () => { const c = state.tasks.get(g.id); if (c) Store.put({ ...c, start:t.start || null, due:t.due || null }); if (state.openId === g.id) renderDrawer(); });
  }
  document.addEventListener('pointerup', e => endDrag(e, false));
  document.addEventListener('pointercancel', e => endDrag(e, true));

  // editor events
  D.addEventListener('click', e => {
    if (e.target.closest('[data-act="close"]')) { closeDrawer(); return; }
    if (e.target.closest('[data-act="done"]')) { toggleDone(state.openId); return; }
    if (e.target.id === 'create') { createDraft(); return; }
    const t = cur(); if (!t) return;
    const sbtn = e.target.closest('#f_status button');
    if (sbtn) { const s = sbtn.dataset.s; edit({ status:s, doneAt: s==='done' ? (t.doneAt || Date.now()) : null }); renderDrawer(); return; }
    const pb = e.target.closest('[data-p]');
    if (pb) { edit({ priority:+pb.dataset.p }); renderDrawer(); return; }
    const qd = e.target.closest('[data-qd]');
    if (qd) { const v = qd.dataset.qd; edit(v ? schedPatch(t, 'due', v) : { start:null, due:null }); renderDrawer(); return; }
    const pj = e.target.closest('[data-proj]');
    if (pj) { const p = pj.dataset.proj; edit({ project: t.project === p ? '' : p }); renderDrawer(); return; }
    const rm = e.target.closest('[data-rm]');
    if (rm) { const subs = t.subtasks.map(s=>({...s})); subs.splice(+rm.dataset.rm, 1); edit({ subtasks:subs }); renderDrawer(); return; }
    if (e.target.id === 'dup') {
      flushTyping();
      const s = state.tasks.get(state.openId);
      const n = { ...s, id:uid(), title:s.title + ' (copy)', status: s.status === 'done' ? 'todo' : s.status, doneAt:null, star:false, createdAt:Date.now(), subtasks:(s.subtasks||[]).map(x=>({...x})) };
      Store.put(n); openDrawer(n.id); toast('Duplicated — you’re now editing the copy'); return;
    }
    if (e.target.id === 'del') {
      flushTyping();
      const id = state.openId, copy = { ...state.tasks.get(id) };
      closeDrawer(); Store.remove(id);
      // restore under a fresh id so a late realtime "delete" echo can't remove it again
      toast('Task deleted', 'Undo', () => { Store.put({ ...copy, id:uid() }); });
    }
  });
  D.addEventListener('change', e => {
    const el = e.target, t = cur(); if (!t) return;
    if (el.id === 'f_start') { edit(schedPatch(t, 'start', el.value)); renderDrawer(); }
    if (el.id === 'f_due') { edit(schedPatch(t, 'due', el.value)); renderDrawer(); }
    if (el.id === 'f_dur') { if (el.value === '') return; edit(schedPatch(t, 'dur', el.value)); renderDrawer(); }
    if (el.id === 'f_proj') { edit({ project: el.value.trim().replace(/^#/, '') }); renderDrawer(); }
    if (el.matches('#subs input[type=checkbox]')) { const subs = t.subtasks.map(s=>({...s})); subs[+el.dataset.i].done = el.checked; edit({ subtasks:subs }); renderDrawer(); }
  });
  D.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'f_title') {
      autosize(t);
      if (state.creating) { t.classList.remove('need'); $('#titleErr').textContent = ''; editTyped({ title: t.value }); }
      else if (t.value.trim()) editTyped({ title: t.value.trim() });
    }
    if (t.id === 'f_notes') editTyped({ notes: t.value });
    if (t.id === 'f_wait') editTyped({ waitingOn: t.value.trim() });
  });
  D.addEventListener('submit', e => {
    if (e.target.id !== 'subadd') return; e.preventDefault();
    const inp = $('#f_sub'), v = inp.value.trim(); if (!v) return;
    const task = cur(); if (!task) return;
    edit({ subtasks:[...(task.subtasks||[]).map(s=>({...s})), { t:v, done:false }] });
    renderDrawer(); $('#f_sub').focus();
  });
  D.addEventListener('keydown', e => {
    if (e.target.id === 'f_title' && e.key === 'Enter') { e.preventDefault(); if (state.creating) createDraft(); else e.target.blur(); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (state.openId || state.creating)) { flushTyping(); closeDrawer(); return; }
    if (state.creating && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); createDraft(); return; }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'N') { e.preventDefault(); openCreate(); return; }
    if (e.key === 'n' || e.key === '/') { e.preventDefault(); (e.key === '/' ? $('#search') : $('#qa')).focus(); }
  });
  function flushTyping(){
    clearTimeout(typingTimer);
    const t = cur(); if (!t || D.dataset.for !== (state.creating ? 'new' : t.id)) return;
    const title = $('#f_title')?.value.trim(), notes = $('#f_notes')?.value, wait = $('#f_wait')?.value.trim();
    const patch = {};
    if (state.creating && title != null) patch.title = title;
    else if (title && title !== t.title) patch.title = title;
    if (notes != null && notes !== (t.notes||'')) patch.notes = notes;
    if (wait != null && wait !== (t.waitingOn||'')) patch.waitingOn = wait;
    if (Object.keys(patch).length) edit(patch);
  }
  D.addEventListener('focusout', e => { if (['f_title','f_notes','f_wait'].includes(e.target.id)) { clearTimeout(typingTimer); flushTyping(); } });

  // midnight rollover: re-render once a minute so "Today" stays right
  let lastDay = todayStr();
  setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 60000);

  // ---------- boot ----------
  const h = (location.hash || '').slice(1);
  if (VIEWS[h]) state.view = h;
  renderHint(); render();
  connect();
})();
</script>
</body>
</html>
